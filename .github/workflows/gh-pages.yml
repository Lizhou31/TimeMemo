# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned on purpose. `latest` silently broke this site: FixIt needs a
          # Hugo whose template-lookup rules it was built against. Bump this
          # deliberately, after `hugo --gc --minify` passes locally.
          hugo-version: ${{ vars.HUGO_VERSION || '0.165.0' }}
          extended: true
      - name: Hugo build
        run: hugo --gc --minify --logLevel info
      - name: Upload artifact
        # v4 stopped bundling dotfiles into the artifact. Hugo emits none here
        # (checked), so no `include-hidden-files` needed — but if a future theme
        # or static/ file starts with a dot, it will silently not be published.
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload only the public directory
          path: './public'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
